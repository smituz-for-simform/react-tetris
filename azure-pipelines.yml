#This is the build pipeline

trigger:
- master

pool:
  name: 'Local Device'

steps:
- script: echo Running on my on-premises device!
  displayName: 'Verify Runner Location'

- task: UseNode@1
  inputs:
    version: '24.16.0'
    force32bit: false

# Installing Dependencies
- script: npm install
  displayName: 'Install Dependencies'

# Creating the Build
- script: npm run build
  displayName: 'Creating the Build Artifact'

- task: PublishPipelineArtifact@1
  displayName: 'Publishing Artifact'
  inputs:
    targetPath: '$(Pipeline.Workspace)'
    artifact: 'tetris-artifact'
    publishLocation: 'pipeline'